name: Deploy Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies & Build NestJS
        run: |
          pnpm install --frozen-lockfile
          pnpm prisma generate
          pnpm build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/z1zone-team/sub1s-server:latest
            ghcr.io/z1zone-team/sub1s-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to OCI ARM VM via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ~/sub1s-deploy
            ./fetch-env.sh
            sudo docker compose pull server
            sudo docker compose up -d server

            echo "지하철 그래프 DB 시딩 동기화..."
            sudo docker compose exec -T server node dist/scripts/seed-subway-graph.js || true
            sudo docker compose restart server

            for i in $(seq 1 20); do
              if sudo docker compose exec -T server node -e "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" > /dev/null 2>&1; then
                echo "✅ Sub1S 서버 헬스체크 성공"
                sudo docker compose exec -T nginx nginx -s reload || true
                exit 0
              fi
              echo "서버 기동 대기 중... ($i/20)"
              sleep 4
            done
            echo "❌ 헬스체크 타임아웃"
            sudo docker compose logs --tail 50 server
            exit 1

      - name: Prune unused images
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            sudo docker image prune -f
            df -h /
