name: CI

on:
  pull_request:
    branches: [main]
  # deploy.yml calls this workflow so a push to main is verified before it is built and deployed
  workflow_call:

# New pushes to a PR cancel the older run. Runs started from deploy.yml are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # health and clerk-auth e2e need a real database; the other e2e suites mock Prisma
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sub1s_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d sub1s_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/sub1s_ci

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Create database schema
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d sub1s_ci -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          pnpm prisma db push --skip-generate

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test --ci

      - name: E2E tests
        run: pnpm test:e2e --ci
