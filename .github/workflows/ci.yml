name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

# PR에 새 push가 오면 이전 실행을 취소한다. deploy.yml에서 호출한 실행은 취소하지 않는다
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # health, clerk-auth e2e는 실제 DB가, voice-jobs e2e는 Valkey가 필요하다
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sub1s_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d sub1s_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # voice-jobs e2e가 실제 큐(BullMQ)를 쓴다
      valkey:
        image: valkey/valkey:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/sub1s_ci

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      # schema.prisma만 바꾸고 마이그레이션을 빠뜨리면 실패한다
      - name: Check migrations match schema.prisma
        run: pnpm exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: E2E tests
        id: e2e
        run: pnpm test:e2e --json --outputFile=/tmp/sub1s-e2e-results.json

      - name: Report failing E2E assertions
        if: failure() && steps.e2e.outcome == 'failure'
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const file = '/tmp/sub1s-e2e-results.json';
          if (!fs.existsSync(file)) process.exit(0);
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          const annotate = (message) => console.log('::error::' + message.slice(0, 12000)
            .replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A'));
          for (const suite of report.testResults) {
            const failed = suite.assertionResults.filter((test) => test.status === 'failed');
            for (const test of failed) annotate(test.fullName + '\n' + test.failureMessages.join('\n'));
            if (suite.status === 'failed' && !failed.length) annotate(suite.name + '\n' + suite.message);
          }
          JS
